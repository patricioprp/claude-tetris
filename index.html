<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-section">
          <span class="label">TEMA</span>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" aria-label="Cambiar a modo claro" />
            <span class="theme-slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section hold-section" id="hold-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> reserva</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="records-panel" class="records hidden">
          <div id="name-entry" class="name-entry hidden">
            <label class="records-subtitle" for="player-name">¡Entraste en el top 5! Tu nombre:</label>
            <div class="name-entry-row">
              <input type="text" id="player-name" maxlength="8" value="ANON" autocomplete="off" spellcheck="false" />
              <button id="save-score-btn" class="records-btn">Guardar</button>
            </div>
          </div>
          <p class="records-title">MEJORES PUNTAJES</p>
          <ol id="records-list" class="records-list"></ol>
          <p class="records-stats">
            Mejor combo: <span id="records-combo">0</span> ·
            Máx. líneas: <span id="records-maxlines">0</span>
          </p>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay start-screen">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div class="records">
          <p class="records-title">MEJORES PUNTAJES</p>
          <ol id="start-records-list" class="records-list"></ol>
          <p class="records-stats">
            Mejor combo: <span id="start-combo">0</span> ·
            Máx. líneas: <span id="start-maxlines">0</span>
          </p>
        </div>
        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn" class="records-btn secondary">Resetear records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
